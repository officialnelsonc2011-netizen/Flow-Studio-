<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flow Studio — AI Video Workspace</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090b10;
      color: #f3f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: #11141c;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .logo { font-weight: 700; font-size: 18px; color: #38bdf8; }
    .btn {
      background: #1e2536;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.14);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6e7bff, #38bdf8);
      border: none;
      font-weight: 600;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
    }
    main {
      flex: 1;
      padding: 16px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: #11141c;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 16px;
    }
    .card h2 { font-size: 15px; margin-bottom: 10px; color: #9aa3b5; }
    textarea, input, select {
      width: 100%;
      background: #181c27;
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .video-box {
      background: #05070a;
      border: 1px dashed rgba(255,255,255,0.15);
      border-radius: 12px;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      color: #6c7486;
      overflow: hidden;
    }
    video { width: 100%; border-radius: 10px; }
    .status { font-size: 13px; color: #38bdf8; margin-top: 8px; }
    #settingsModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      padding: 20px;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal-box {
      background: #11141c;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">✦ Flow Studio</div>
    <button class="btn" onclick="openSettings()">⚙ Settings</button>
  </header>

  <main>
    <div class="card">
      <h2>1. AI Prompt Assistant (Gemini)</h2>
      <input id="ideaInput" placeholder="Enter a short idea (e.g. a cybernetic lion in Lagos)..." />
      <button class="btn" style="width:100%" onclick="expandPrompt()">✨ Expand Idea into Video Prompt</button>
    </div>

    <div class="card">
      <h2>2. Video Generator</h2>
      <select id="spaceSelect">
        <option value="Lightricks/ltx-video-distilled">LTX-Video Distilled (Fast Free GPU)</option>
        <option value="Wan-AI/Wan2.1">Wan 2.1 Text-to-Video (Free GPU)</option>
      </select>
      <textarea id="promptInput" rows="3" placeholder="Detailed video prompt will appear here..."></textarea>
      <button class="btn btn-primary" onclick="generateVideo()">🎬 Generate Video</button>
      <div id="statusText" class="status"></div>
    </div>

    <div class="card">
      <h2>3. Preview</h2>
      <div class="video-box" id="playerArea">
        Your generated video will appear here.
      </div>
    </div>
  </main>

  <div id="settingsModal">
    <div class="modal-box">
      <h2 style="margin-bottom:12px;">API Settings</h2>
      <label style="font-size:12px;color:#9aa3b5;">Gemini API Key (Free)</label>
      <input id="geminiKeyInput" type="password" placeholder="AIza..." />
      <label style="font-size:12px;color:#9aa3b5;">Hugging Face Read Token (Optional)</label>
      <input id="hfTokenInput" type="password" placeholder="hf_..." />
      <button class="btn btn-primary" onclick="saveSettings()">Save Keys</button>
      <button class="btn" style="width:100%;margin-top:8px;" onclick="closeSettings()">Close</button>
    </div>
  </div>

  <script>
    function openSettings() {
      document.getElementById("geminiKeyInput").value = localStorage.getItem("flow_gemini_key") || "";
      document.getElementById("hfTokenInput").value = localStorage.getItem("flow_hf_token") || "";
      document.getElementById("settingsModal").style.display = "flex";
    }
    function closeSettings() {
      document.getElementById("settingsModal").style.display = "none";
    }
    function saveSettings() {
      localStorage.setItem("flow_gemini_key", document.getElementById("geminiKeyInput").value.trim());
      localStorage.setItem("flow_hf_token", document.getElementById("hfTokenInput").value.trim());
      closeSettings();
      alert("Keys saved!");
    }

    async function expandPrompt() {
      const key = localStorage.getItem("flow_gemini_key");
      const idea = document.getElementById("ideaInput").value.trim();
      const status = document.getElementById("statusText");
      if (!key) { alert("Please tap Settings at the top right and paste your Gemini API key first."); return; }
      if (!idea) { alert("Type a short video idea first."); return; }

      status.textContent = "Writing detailed cinematic prompt with Gemini...";
      try {
        const res = await fetch("https://googleapis.com" + encodeURIComponent(key), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: "Turn this short idea into one rich, cinematic AI video generation prompt (under 60 words, describe camera movement, lighting, and motion, no intro text): " + idea }] }]
          })
        });
        const data = await res.json();
        const candidates = data.candidates || [];
        const parts = (candidates.at(0) && candidates.at(0).content && candidates.at(0).content.parts) || [];
        const text = parts.at(0) && parts.at(0).text;
        if (text) {
          document.getElementById("promptInput").value = text.trim();
          status.textContent = "Prompt ready! Tap Generate Video.";
        } else {
          status.textContent = "Gemini error: " + ((data.error && data.error.message) || "Check your API key.");
        }
      } catch (err) {
        status.textContent = "Network error: " + err.message;
      }
    }

    async function generateVideo() {
      const prompt = document.getElementById("promptInput").value.trim();
      const spaceId = document.getElementById("spaceSelect").value;
      const hfToken = localStorage.getItem("flow_hf_token");
      const status = document.getElementById("statusText");
      const playerArea = document.getElementById("playerArea");

      if (!prompt) { alert("Enter or expand a prompt first."); return; }
      status.textContent = "Connecting to free Hugging Face GPU (" + spaceId + ")...";

      try {
        const mod = await import("https://jsdelivr.net");
        const Client = mod.Client;
        const client = await Client.connect(spaceId, hfToken ? { hf_token: hfToken } : {});
        status.textContent = "Generating video on cloud GPU (takes 30-90 seconds)...";
        const result = await client.predict(0, { prompt: prompt });
        const outList = result.data || [];
        const firstItem = outList.at(0);
        const videoUrl = (firstItem && firstItem.url) || (firstItem && firstItem.video && firstItem.video.url) || firstItem;

        if (videoUrl && typeof videoUrl === "string") {
          playerArea.innerHTML = '<video src="' + videoUrl + '" controls autoplay loop playsinline></video>';
          status.textContent = "Video generated!";
        } else {
          status.textContent = "Space returned unexpected output. Try switching models or adding an HF token.";
        }
      } catch (err) {
        status.textContent = "GPU Queue/Error: " + err.message + " (Free public Spaces can be busy—try again or add an HF token in Settings).";
      }
    }
  </script>
</body>
</html>
